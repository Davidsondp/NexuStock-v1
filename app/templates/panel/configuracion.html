<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-nexustock-isotipo.png') }}"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Configuración | NexuStock</title><link rel="stylesheet" href="{{ url_for('static', filename='css/configuracion.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/sistema_visual.css') }}"></head>
<body data-api="{{ url_for('configuracion.obtener') }}"><main>
<header><div><a href="{{ url_for('panel.inicio') }}">← Volver al panel</a><h1>Configuración empresarial</h1><p>Datos legales, identidad y reglas operacionales.</p></div><strong id="plan"></strong></header>
<div class="grid">
<form id="empresa" class="tarjeta"><h2>Datos de la empresa</h2><div class="campos">
<label>Razón social<input name="nombre" required></label><label>RUT o identificación<input name="identificacion_fiscal"></label><label>Correo<input name="email" type="email" required></label><label>Teléfono<input name="telefono"></label><label>Dirección<input name="direccion"></label><label>Ciudad<input name="ciudad"></label><label>País<select name="pais"><option>CL</option><option>AR</option><option>PE</option><option>CO</option><option>MX</option><option>US</option><option>ES</option></select></label><label>Moneda<select name="moneda"><option>CLP</option><option>USD</option><option>EUR</option></select></label><label>Idioma<select name="idioma"><option value="es">Español</option><option value="en">Inglés</option></select></label><label>Zona horaria<input name="zona_horaria"></label></div>{% if permisos.empresa %}<button>Guardar empresa</button>{% endif %}</form>
<form id="preferencias" class="tarjeta"><h2>Preferencias</h2><div class="campos"><label>Nombre comercial<input name="nombre_comercial" required></label><label>Logo público HTTPS<input name="logo_url" type="url"></label><label>Color principal<input name="color_principal" type="color"></label><label>Días sin movimiento<input name="dias_sin_movimiento" type="number" min="1" max="3650"></label><label class="opcion"><input name="alerta_stock_bajo" type="checkbox"> Alertas de stock bajo</label><label class="opcion"><input name="alerta_sobrestock" type="checkbox"> Alertas de sobrestock</label><label class="opcion"><input name="mostrar_costos_dashboard" type="checkbox"> Mostrar costos</label><label class="opcion"><input name="mostrar_stock_cero" type="checkbox"> Mostrar stock cero</label><label>Decimales<select name="decimales_cantidad"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label>Formato fecha<select name="formato_fecha"><option>DD-MM-AAAA</option><option>AAAA-MM-DD</option><option>DD/MM/AAAA</option></select></label></div>{% if permisos.preferencias %}<button>Guardar preferencias</button>{% endif %}</form>
</div><div id="mensaje" hidden></div></main><script src="{{ url_for('static', filename='js/configuracion.js') }}" defer></script></body></html>
