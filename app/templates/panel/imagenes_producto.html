<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-nexustock-isotipo.png') }}"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Imágenes de {{ producto.nombre }} | NexuStock</title><link rel="stylesheet" href="{{ url_for('static', filename='css/configuracion.css') }}"></head><body data-api="{{ url_for('productos.listar_imagenes', producto_id=producto.id) }}" data-editar="{{ puede_editar | tojson }}"><main><header><div><a href="{{ url_for('panel.productos') }}">← Volver a productos</a><h1>Imágenes de {{ producto.nombre }}</h1><p>Hasta ocho imágenes HTTPS. La principal se utiliza en listados y catálogo.</p></div></header>{% if puede_editar %}<form id="agregar" class="tarjeta"><div class="campos"><label>URL HTTPS de imagen<input name="url" type="url" required placeholder="https://…/producto.webp"></label><label class="opcion"><input name="es_principal" type="checkbox"> Establecer como principal</label></div><button>Agregar imagen</button></form>{% endif %}<section id="galeria" class="grid"></section></main><script src="{{ url_for('static', filename='js/imagenes_producto.js') }}" defer></script></body></html>
