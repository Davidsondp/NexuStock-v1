<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-nexustock-isotipo.png') }}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segundo factor | NexuStock</title><link rel="stylesheet" href="{{ url_for('static', filename='css/autenticacion.css') }}"></head><body><main class="autenticacion"><section class="tarjeta-autenticacion"><h1>Segundo factor</h1><p>Ingresa el código de seis dígitos de tu aplicación autenticadora.</p>{% for categoria, mensaje in get_flashed_messages(with_categories=true) %}<p class="alerta alerta--{{ categoria }}">{{ mensaje }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Código<input name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button type="submit">Verificar</button></form></section></main></body></html>
